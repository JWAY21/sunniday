name: Sunday
options:
  bundleIdPrefix: com.jway
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.jway.sunniday
    MARKETING_VERSION: 1.3
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: "G46528YB86"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Sunday:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      - Resources/LaunchScreen.storyboard
      # Required since May 2024. UserDefaults is a required-reason API, so
      # without this the upload is flagged ITMS-91053. Must sit under
      # sources: — xcodegen ignores a resources: key (see ci notes).
      - Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: SUNniDAY
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Without this the app target gets XcodeGen's literal "1" default and
        # silently ignores CURRENT_PROJECT_VERSION, while the widget below
        # picks the bump up — so the two could ship mismatched build numbers.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: 
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "SUNniDAY needs your location to determine UV levels at your current position"
        # No NSLocationAlwaysAndWhenInUseUsageDescription: the app only ever
        # calls requestWhenInUseAuthorization() and never sets
        # allowsBackgroundLocationUpdates, so declaring Always asked for more
        # access than the app uses (Guideline 5.1.1).
        NSHealthShareUsageDescription: "SUNniDAY reads your health data to provide personalized vitamin D recommendations"
        NSHealthUpdateUsageDescription: "SUNniDAY saves your vitamin D intake data to Health app"
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationCenterUsageDescription: "SUNniDAY sends reminders for sunrise, sunset, and solar noon to help you track vitamin D"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sunday
            CFBundleURLName: com.jway.sunniday
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "Sources"
        CODE_SIGN_ENTITLEMENTS: Resources/Sunday.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    capabilities:
      - com.apple.HealthKit
      # No BackgroundModes. This block never reached the built Info.plist
      # (xcodegen capabilities only drive entitlements), and the app has no
      # background location: it never sets allowsBackgroundLocationUpdates and
      # restores a session from a persisted timestamp instead. Removed so a
      # future xcodegen that does honour it can't silently declare an unused
      # background mode (Guideline 2.5.4).
      - com.apple.ApplicationGroups:
          enabled: true
          groups:
            - group.jway21.sunniday.widget
    dependencies:
      - target: SundayWidget
  
  SundayWidget:
    type: app-extension
    platform: iOS
    sources:
      - SundayWidget
    info:
      path: SundayWidget/Info.plist
      properties:
        CFBundleDisplayName: SUNniDAY Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jway.sunniday.widget
        INFOPLIST_FILE: SundayWidget/Info.plist
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SundayWidget/SundayWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    capabilities:
      - com.apple.ApplicationGroups:
          enabled: true
          groups:
            - group.jway21.sunniday.widget
